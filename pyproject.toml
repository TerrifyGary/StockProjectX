[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-news-event-monitor"
version = "0.1.0"
description = "Collect and summarize multilingual stock-related news"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
test = ["mongomock>=4.3,<5"]
local-model = [
    "torch>=2.2,<3",
    "transformers>=4.45,<5",
    "sentencepiece>=0.2,<1",
    "protobuf>=4.25,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
stock-news = "stock_news.cli:main"
stock-news-scheduler = "stock_news.scheduler:main"
