<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Stock news collection and dashboard workflow</title>
  <desc id="desc">A workflow showing configurable US and Taiwan coverage flowing from multilingual news sources through a Python collector, normalization, deduplication, summarization, MongoDB, and a Vue dashboard, with retry handling for summarization failures.</desc>
  <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#14251f"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2458a6"/>
      <stop offset="1" stop-color="#183b78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#60748c"/>
    </marker>
    <marker id="arrow-light" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#dbe8ff"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 38px; font-weight: 750; fill: #f2f6fc; }
      .subtitle { font-size: 18px; fill: #aab9cc; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; fill: #9db4d0; }
      .card-title { font-size: 20px; font-weight: 700; fill: #e7effa; }
      .body { font-size: 15px; fill: #c0ccda; }
      .small { font-size: 12px; fill: #99aabd; }
      .step { font-size: 12px; font-weight: 750; letter-spacing: 1.2px; fill: #91afd4; }
      .light-title { font-size: 20px; font-weight: 700; fill: #fff; }
      .light-body { font-size: 14px; fill: #e4edff; }
      .line { fill: none; stroke: #8092aa; stroke-width: 3; marker-end: url(#arrow); }
      .line-light { fill: none; stroke: #dbe8ff; stroke-width: 2.5; marker-end: url(#arrow-light); }
    </style>
  </defs>

  <rect width="1440" height="960" rx="28" fill="url(#bg)"/>
  <text x="76" y="82" class="eyebrow">STOCK NEWS EVENT MONITOR</text>
  <text x="76" y="132" class="title">From news sources to a searchable dashboard</text>
  <text x="76" y="166" class="subtitle">Initial coverage: US + Taiwan markets · English · 繁體中文 · 简体中文 · 日本語</text>

  <!-- source and configuration cards -->
  <g filter="url(#shadow)">
    <rect x="76" y="225" width="274" height="184" rx="18" fill="#1d2939" stroke="#34445a"/>
    <rect x="76" y="225" width="8" height="184" rx="4" fill="#e8a33b"/>
    <rect x="76" y="449" width="274" height="184" rx="18" fill="#1d2939" stroke="#34445a"/>
    <rect x="76" y="449" width="8" height="184" rx="4" fill="#42a58c"/>
    <rect x="422" y="225" width="512" height="408" rx="22" fill="url(#backend)"/>
    <rect x="1000" y="225" width="364" height="184" rx="18" fill="#1d2939" stroke="#34445a"/>
    <rect x="1000" y="225" width="8" height="184" rx="4" fill="#755cc7"/>
    <rect x="1000" y="449" width="364" height="184" rx="18" fill="#1d2939" stroke="#34445a"/>
    <rect x="1000" y="449" width="8" height="184" rx="4" fill="#2c9a81"/>
  </g>

  <text x="104" y="262" class="step">01 · INPUT</text>
  <text x="104" y="296" class="card-title">News sources</text>
  <text x="104" y="327" class="body">Publisher feeds · official APIs</text>
  <text x="104" y="351" class="body">Permitted webpages</text>
  <text x="104" y="378" class="small">Keep source attribution</text>
  <text x="104" y="396" class="small">and original article URL</text>

  <text x="104" y="486" class="step">CONFIGURATION</text>
  <text x="104" y="520" class="card-title">Coverage settings</text>
  <text x="104" y="551" class="body">US + Taiwan · companies · tickers</text>
  <text x="104" y="575" class="body">Localized names and search aliases</text>
  <text x="104" y="600" class="small">Configure later through</text>
  <text x="104" y="618" class="small">the frontend</text>

  <text x="454" y="270" class="eyebrow" fill="#c4d8ff">PYTHON BACKEND</text>
  <text x="454" y="307" class="light-title">Collect · prepare · summarize</text>
  <line x1="454" y1="330" x2="902" y2="330" stroke="#7597cb" stroke-opacity=".55"/>

  <circle cx="470" cy="369" r="15" fill="#d9e7ff"/>
  <text x="470" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#1e4e91">1</text>
  <text x="500" y="375" class="light-title" font-size="17">Fetch and extract article metadata/text</text>
  <circle cx="470" cy="419" r="15" fill="#d9e7ff"/>
  <text x="470" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#1e4e91">2</text>
  <text x="500" y="425" class="light-title" font-size="17">Normalize language, dates, company aliases</text>
  <circle cx="470" cy="469" r="15" fill="#d9e7ff"/>
  <text x="470" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#1e4e91">3</text>
  <text x="500" y="475" class="light-title" font-size="17">Deduplicate by canonical URL / source ID</text>
  <circle cx="470" cy="519" r="15" fill="#d9e7ff"/>
  <text x="470" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#1e4e91">4</text>
  <text x="500" y="525" class="light-title" font-size="17">Generate summary; preserve original evidence</text>
  <rect x="454" y="562" width="448" height="43" rx="10" fill="#ffffff" fill-opacity=".12"/>
  <text x="470" y="589" class="light-body">API serves records and coverage settings to the dashboard</text>

  <text x="1030" y="262" class="step">03 · PERSIST</text>
  <text x="1030" y="296" class="card-title">MongoDB</text>
  <text x="1030" y="327" class="body">Article + generated summary</text>
  <text x="1030" y="351" class="body">Publisher, URL, date, language, tickers</text>
  <text x="1030" y="378" class="small">Retry summaries after</text>
  <text x="1030" y="396" class="small">temporary failures</text>

  <text x="1030" y="486" class="step">04 · PRESENT</text>
  <text x="1030" y="520" class="card-title">Vue.js dashboard</text>
  <text x="1030" y="551" class="body">Search · filter · read summaries</text>
  <text x="1030" y="575" class="body">Open the original source URL</text>
  <text x="1030" y="600" class="small">Later: manage markets and</text>
  <text x="1030" y="618" class="small">watchlist settings here</text>

  <!-- directional arrows -->
  <path d="M350 315 H402 Q412 315 422 315" class="line"/>
  <path d="M350 541 H384 Q402 541 402 523 V380 Q402 360 422 360" class="line"/>
  <path d="M934 315 H968 Q984 315 1000 315" class="line"/>
  <path d="M1000 541 H968 Q950 541 950 523 V378 Q950 360 934 360" class="line"/>
  <path d="M934 566 H965 Q982 566 1000 566" class="line"/>

  <!-- summarization retry -->
  <rect x="422" y="688" width="512" height="108" rx="16" fill="#332b1d" stroke="#72552b"/>
  <text x="450" y="720" class="step" fill="#f0bd62">RETRY PATH</text>
  <text x="450" y="748" class="body" fill="#e6d7b8">If summary generation fails, save the article with</text>
  <text x="450" y="770" class="body" fill="#e6d7b8">a pending/failed status and retry later. Keep its</text>
  <text x="450" y="792" class="body" fill="#e6d7b8">source record even when a summary is unavailable.</text>
  <path d="M678 633 V670 Q678 688 678 688" fill="none" stroke="#d29a39" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>

  <rect x="76" y="833" width="1288" height="70" rx="16" fill="#1b302d" stroke="#2b5149"/>
  <text x="108" y="865" class="card-title" font-size="16">Next phase</text>
  <text x="222" y="865" class="body">Add relevance categories and event analysis after collection and summarization are stable.</text>
  <text x="108" y="889" class="small">Summaries stay linked to the original publisher and URL for review.</text>
</svg>
